x-common-env: &common-env
  env_file: [ .env ]

x-common-opts: &common-opts
  restart: unless-stopped
  <<: *common-env
  # Tells Docker to send logs to Fluentd AND keep a local cache for terminal commands
  logging:
    driver: fluentd
    options:
      fluentd-address: "127.0.0.1:24224"
      tag: "{{.Name}}"
      fluentd-async: "true"
      # Limits the local cache size so 'docker compose logs' doesn't eat disk space
      cache-max-size: "500m"
      cache-max-file: "30"

services:
  # The new logging sidecar
  fluentd:
    image: fluent/fluentd:v1.19-2
    user: root
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      # This is where your permanent logs will live on your server
      - /home/aarif/Documents/Docker_logs:/fluentd/log
      # The configuration file we will create in Step 2
      - ./fluent.conf:/fluentd/etc/fluent.conf
    networks: [ internal_net ]
    restart: unless-stopped

  admin-ui:
    build:
      context: ./admin-ui/
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${ADMIN_BASE_URL}
        VITE_API_BASE_URL: ${ADMIN_BASE_URL}
        VITE_RASA_TRAINING_BASE_URL: ${ADMIN_BASE_URL}/train
    ports:
      - "5878:80"
    <<: *common-opts
    networks: [ internal_net ]

  bot-ui:
    build:
      context: ./bot-ui/
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${BOT_BASE_URL}
        VITE_API_BASE_URL: ${BOT_BASE_URL}
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    ports:
      - "5737:80"
    <<: *common-opts
    networks: [ internal_net ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      RASA_CORE_URL: "http://rasa_core:5005"
      BACKEND_URL: "http://backend:3000"
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SENTRY_DSN: "https://8ae69f223d0dbf3d5994ea81da6a8d84@o4511150436450304.ingest.us.sentry.io/4511150447263744"
    depends_on:
      - rasa_core
      - redis
    volumes:
      - ./backend/Media:/index/Media
      - ./profiles:/profiles  # py-spy writes flame graph SVGs here
    cap_add:
      - SYS_PTRACE           # required for py-spy to attach to the process
    security_opt:
      - seccomp:unconfined   # required for ptrace syscalls inside Docker
    <<: *common-opts
    networks: [ internal_net ]

  rasa_core:
    build:
      context: ./rasa
      dockerfile: Dockerfile_Core
    ports:
      - "5005:5005"
    environment:
      SANIC_WORKERS: 2
      RASA_ACTIONS_URL: "http://rasa_actions:5055"
      BACKEND_URL: "http://backend:3000"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - rasa_actions
      - redis
    volumes:
      - ./rasa/models:/app/models
    <<: *common-opts
    networks: [ internal_net ]

  rasa_actions:
    build:
      context: ./rasa
      dockerfile: Dockerfile_Actions
    ports:
      - "5055:5055"
    depends_on:
      - redis
    environment:
      ACTION_SERVER_SANIC_WORKERS: 2
      BACKEND_URL: "http://backend:3000"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SENTRY_DSN: "https://8ae69f223d0dbf3d5994ea81da6a8d84@o4511150436450304.ingest.us.sentry.io/4511150447263744"
    volumes:
      - ./profiles:/profiles  # py-spy writes flame graph SVGs here
    cap_add:
      - SYS_PTRACE           # required for py-spy to attach to the process
    security_opt:
      - seccomp:unconfined   # required for ptrace syscalls inside Docker
    <<: *common-opts
    networks: [ internal_net ]

  rasa_training:
    build:
      context: ./rasa
      dockerfile: Dockerfile_Training
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: "http://backend:3000"
      RASA_CORE_URL: "http://rasa_core:5005"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./rasa/models:/app/models
    depends_on:
      - redis
    <<: *common-opts
    networks: [ internal_net ]

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    <<: *common-opts
    networks: [ internal_net ]

networks:
  internal_net:
    internal: false

volumes:
  redis_data:
