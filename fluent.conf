<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match **>
  @type file
  path /fluentd/log/${tag}/%Y%m%d
  
  compress gzip
  
  <buffer tag, time>
    @type file
    path /fluentd/log/buffer
    timekey 1d
    timekey_wait 10m
    flush_mode interval
    flush_interval 5s
  </buffer>
  
  append true
</match>
